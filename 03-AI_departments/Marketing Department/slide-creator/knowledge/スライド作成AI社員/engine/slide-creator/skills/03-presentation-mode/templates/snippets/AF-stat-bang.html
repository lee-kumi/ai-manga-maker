<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><title>§AF tpl-stat-bang</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="stylesheet" href="../_shared/style.css?v=4">
<style>
html,body{background:#000;margin:0;padding:0;height:100%}
.stage{position:fixed;inset:0;width:100vw;height:100vh;background:#000;overflow:hidden}
.slide{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));
  container-type:inline-size;background:#fff;color:var(--c-dark);
  overflow:hidden;display:flex;font-family:var(--font-sans);
  opacity:1;visibility:visible;}
.hint{position:fixed;top:14px;left:14px;font-family:var(--font-num);font-size:11px;
  letter-spacing:.18em;color:#fff;background:rgba(0,0,0,.6);padding:6px 12px;border-radius:999px;z-index:99;max-width:80vw}
</style></head><body>
<div class="hint">§AF .tpl-stat-bang — 大数字バーン(（フォロワー数）など1メトリック1枚)</div>
<div class="stage"><section class="slide tpl-stat-bang"><p class="tpl-stat-bang__eyebrow">QUESTION</p><p class="tpl-stat-bang__n">（フォロワー数）<small>人</small></p><p class="tpl-stat-bang__caption">これ、<span class="accent">何の数字</span>か<br>わかりますか？</p></section></div>
</body></html>

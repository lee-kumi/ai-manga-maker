<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><title>tpl-cover</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="stylesheet" href="../_shared/style.css?v=6">
<style>
html,body{background:#000;margin:0;padding:0;height:100%}
.stage{position:fixed;inset:0;width:100vw;height:100vh;background:#000;overflow:hidden}
.slide{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));
  container-type:inline-size;background:#fff;color:#1a1a2e;
  overflow:hidden;display:flex;font-family:var(--font-sans);
  opacity:1;visibility:visible;}
.hint{position:fixed;top:14px;left:14px;font-family:var(--font-num);font-size:11px;
  letter-spacing:.18em;color:#fff;background:rgba(0,0,0,.6);padding:6px 12px;border-radius:999px;z-index:99;max-width:80vw}
</style></head><body>
<div class="hint">.tpl-cover — 表紙(左テキスト+右ビジュアル) 画像: tpl-cover__img の background-image</div>
<div class="stage"><section class="slide tpl-cover"><div class="tpl-cover__txt"><div class="tpl-cover__eyebrow">サンプルスタジオ × パートナースクール</div><h1 class="tpl-cover__h1">文系でもわかる<br>AIツール <span class="grad">×</span> ナレッジ管理</h1><p class="tpl-cover__sub">〜ナレッジ管理ゼロから〜</p><div class="tpl-cover__meta"><span>2026.01.01 SUN</span><span>20:00 – 22:00</span><span>ONLINE LIVE</span></div></div><div class="tpl-cover__img" style="background-image:url(../_shared/event/cover_event.png)"></div></section></div>
</body></html>

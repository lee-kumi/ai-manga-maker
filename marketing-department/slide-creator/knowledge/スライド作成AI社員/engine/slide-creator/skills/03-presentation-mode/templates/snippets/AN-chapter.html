<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><title>AN chapter</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@800;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;font-family:"Noto Sans JP",sans-serif}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .slide{width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));container-type:inline-size;overflow:hidden;position:relative;
    background:linear-gradient(120deg,#6b5cd8 0%,#8478f0 40%,#b4abff 100%)}
  .slide::before{content:'';position:absolute;top:-10%;right:-20%;width:80%;height:130%;
    background-image:radial-gradient(circle at 30% 50%,rgba(255,255,255,.35) 0%,transparent 50%),radial-gradient(circle at 70% 30%,rgba(255,255,255,.25) 0%,transparent 45%);
    filter:blur(30px);pointer-events:none}
  .brand{position:absolute;top:3cqw;left:4cqw;display:flex;align-items:center;gap:.8cqw;color:#fff;font-size:1.3cqw;font-weight:700;z-index:2}
  .num{position:absolute;top:4cqw;right:5cqw;font-family:Helvetica,sans-serif;font-size:14cqw;font-weight:900;color:#fff;line-height:1;letter-spacing:-.02em;z-index:2;text-shadow:0 .3cqw 1.5cqw rgba(0,0,0,.18)}
  .title{position:absolute;bottom:6cqw;left:4cqw;font-size:6cqw;font-weight:800;color:#fff;line-height:1.15;margin:0;max-width:75%;z-index:2;text-shadow:0 .2cqw .8cqw rgba(0,0,0,.12)}
  .sub{position:absolute;bottom:3cqw;left:4cqw;font-size:1.3cqw;color:rgba(255,255,255,.7);letter-spacing:.15em;z-index:2}
  .footer{position:absolute;bottom:1cqw;right:4cqw;font-size:.9cqw;color:rgba(255,255,255,.55);z-index:2}
</style></head><body><div class="stage"><div class="slide">
  <div class="brand">ブランド Marketing</div>
  <div class="num">2</div>
  <h1 class="title">ブランド流<br>マーケ部の組織図</h1>
  <div class="sub">THE ORG CHART INSIDE ONE FOUNDER</div>
  <div class="footer">tpl-chapter</div>
</div></div></body></html>

<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><title>AM statement-grad</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;font-family:"Noto Sans JP",sans-serif}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .slide{width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));container-type:inline-size;overflow:hidden;position:relative;
    background:linear-gradient(135deg,#7b6ce0 0%,#5d4dca 40%,#4a3eb8 100%)}
  .slide::before{content:'';position:absolute;top:-20%;right:-10%;width:70%;height:140%;
    background:radial-gradient(circle,rgba(255,255,255,.35) 0%,transparent 60%);filter:blur(40px);pointer-events:none}
  .brand{position:absolute;top:3cqw;left:4cqw;display:flex;align-items:center;gap:.8cqw;color:#fff;font-size:1.3cqw;font-weight:700;letter-spacing:.1em;z-index:2}
  .title{position:relative;z-index:2;font-size:5.6cqw;font-weight:800;color:#fff;line-height:1.3;text-align:center;
    margin:0 auto 2.5cqw;max-width:80%;padding-top:30cqw}
  .title .accent{color:#ffd9a8}
  .sub{position:relative;z-index:2;font-size:1.5cqw;color:rgba(255,255,255,.82);text-align:center;margin:0 auto;max-width:65%;line-height:1.9}
  .footer{position:absolute;bottom:2.5cqw;left:0;right:0;display:flex;justify-content:space-between;padding:0 4cqw;font-size:1cqw;color:rgba(255,255,255,.55);z-index:2}
</style></head><body><div class="stage"><div class="slide">
  <div class="brand">ブランド Marketing</div>
  <h1 class="title">マーケ業務は<br><span class="accent">16の役割</span>に分解できる</h1>
  <p class="sub">だから、16人雇うか、AIに分けるか。それしか道はない。</p>
  <div class="footer"><span>§AM ／ statement-grad</span><span>tpl-statement-grad</span></div>
</div></div></body></html>

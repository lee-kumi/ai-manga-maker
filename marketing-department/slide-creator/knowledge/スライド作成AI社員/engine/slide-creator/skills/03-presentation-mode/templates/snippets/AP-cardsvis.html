<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><title>AP cardsvis</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;font-family:"Noto Sans JP",sans-serif}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .slide{width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));container-type:inline-size;overflow:hidden;background:#fff;padding:3cqw 3.5cqw;display:flex;flex-direction:column}
  .kicker{font-size:1.2cqw;font-weight:700;color:#9b8cff;letter-spacing:.2em;margin-bottom:.8cqw}
  .title{font-size:2.8cqw;font-weight:800;color:#1a1a2e;margin:0 0 .5cqw 0;line-height:1.3}
  .lead{font-size:1.3cqw;color:#6c6c8a;margin:0 0 1.8cqw 0;line-height:1.7}
  .row{flex:1;display:flex;gap:2cqw}
  .cards{flex:1.1;display:flex;flex-direction:column;gap:1cqw;justify-content:center}
  .card{background:#f4f2fb;border-left:.35cqw solid #9b8cff;border-radius:.6cqw;padding:1.2cqw 1.4cqw}
  .card h3{font-size:1.35cqw;font-weight:800;color:#1a1a2e;margin:0 0 .3cqw 0}
  .card p{font-size:1cqw;color:#6c6c8a;line-height:1.7;margin:0}
  .visual{flex:1;border-radius:1.2cqw;background:linear-gradient(135deg,#7b6ce0 0%,#c87941 100%);display:flex;align-items:center;justify-content:center;color:#fff;font-size:4cqw;font-weight:800;text-shadow:0 .3cqw 1cqw rgba(0,0,0,.25)}
</style></head><body><div class="stage"><div class="slide">
  <div class="kicker">CARDS × VISUAL</div>
  <h2 class="title">左に3カード + 右に大ビジュアル</h2>
  <p class="lead">サービス紹介・特徴3点を左に、印象的なビジュアルを右に置くレイアウト</p>
  <div class="row">
    <div class="cards">
      <div class="card"><h3>01 ポイント1</h3><p>説明文がここに入ります。3カード並列で密度を保つ。</p></div>
      <div class="card"><h3>02 ポイント2</h3><p>カード間の高さは同じ。ボーダー左が紫アクセント。</p></div>
      <div class="card"><h3>03 ポイント3</h3><p>右の大ビジュアルで視覚的な抜け感を作る。</p></div>
    </div>
    <div class="visual">Visual<br>Area</div>
  </div>
</div></div></body></html>
